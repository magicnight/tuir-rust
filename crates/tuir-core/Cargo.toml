[package]
name = "tuir-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client
reqwest = { version = "0.12", features = ["json"] }

# OAuth2
oauth2 = "5"

# HTTP server (for OAuth callback)
tiny_http = "0.12"

# Configuration
configparser = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Directories
dirs = "5"

# Error handling
anyhow = "1"
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Clipboard
arboard = "3"

# HTML parsing
scraper = "0.26"

# URL
url = "2"

# URL hashing for the media on-disk cache
sha2 = "0.10"
hex = "0.4"

# Async traits
async-trait = "0.1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Async channels
flume = "0.11"

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
tokio-test = "0.4"
